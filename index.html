<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍁 精靈 &amp; 小狐狸的加拿大蜜月 2026 (v1.2.0)</title>
<meta name="description" content="精靈 &amp; 小狐狸的加拿大蜜月行程 2026.09.23–10.17，加拿大東西岸">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
  --bg:#F5F3EF;--card:#FFFFFF;--surf:#F0EDE8;--border:rgba(0,0,0,.07);
  --text:#1A1A1A;--text2:#5A5248;--text3:#A09890;
  --maple:#C0392B;--forest:#1B4332;--gold:#E9A825;
  --r:20px;--r-sm:12px;
  --sh:0 2px 16px rgba(0,0,0,.07);--sh-lg:0 8px 32px rgba(0,0,0,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans TC','Outfit',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}

/* ── VIEWS ── */
.view{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg);
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s ease;
  will-change:transform,opacity;-webkit-overflow-scrolling:touch;
}
.view.off-right{transform:translateX(100%)}
.view.off-left{transform:translateX(-18%);opacity:.35;pointer-events:none}

/* ── SPLASH ── */
.splash{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(135deg,#0D1B2A,#1B2838 50%,#7B241C);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;transition:opacity .5s ease;pointer-events:none;
}
.splash.gone{opacity:0}
.splash-emoji{font-size:80px;margin-bottom:24px;animation:bounce 1s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.splash-ttl{font-size:26px;font-weight:800;margin-bottom:8px;text-align:center}
.splash-sub{font-size:13px;opacity:.65;font-family:'DM Mono',monospace}

/* ── HOME HEADER ── */
.home-hd{
  background:linear-gradient(135deg,#0D1B2A,#1B2838 60%,#7B241C);
  padding:16px 20px 0;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(0,0,0,.3);
}
.home-hd-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
.home-hd-left{flex:1;min-width:0}
.home-hd-ttl{color:#fff;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-hd-sub{color:rgba(255,255,255,.55);font-size:10px;font-family:'DM Mono',monospace;margin-top:1px}
.map-btn{
  display:flex;align-items:center;gap:5px;padding:9px 15px;border-radius:20px;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;white-space:nowrap;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.map-btn:active{background:rgba(255,255,255,.28)}

/* ── STATS BANNER ── */
.stats-bar{
  display:flex;background:var(--card);
  border-bottom:1px solid var(--border);
}
.stat-item{
  flex:1;padding:14px 8px;text-align:center;
  border-right:1px solid var(--border);
}
.stat-item:last-child{border-right:none}
.stat-num{font-size:22px;font-weight:800;font-family:'DM Mono',monospace;color:var(--maple);line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

/* ── CARD LIST ── */
.card-list{padding:16px 16px 80px;max-width:480px;margin:0 auto}
.region-lbl{
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--text3);font-weight:700;padding:4px 4px 8px;
  display:flex;align-items:center;gap:8px;
}
.region-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── DAY CARD ── */
.day-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:14px;
  overflow:hidden;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.day-card:active{transform:scale(.975);box-shadow:0 1px 8px rgba(0,0,0,.1)}
.card-hero{padding:18px 20px 15px;position:relative;overflow:hidden}
.card-hero::after{
  content:attr(data-emoji);position:absolute;right:-6px;bottom:-10px;
  font-size:72px;opacity:.13;line-height:1;pointer-events:none;
}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-daynum{
  font-family:'DM Mono',monospace;font-size:28px;font-weight:700;
  color:rgba(255,255,255,.9);line-height:1;flex-shrink:0;min-width:40px;
}
.card-info{flex:1}
.card-dateline{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);margin-bottom:3px}
.card-ttl{font-size:17px;font-weight:700;color:#fff;line-height:1.3;letter-spacing:-.02em}
.card-body{padding:13px 20px 15px}
.card-route{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:13px;color:var(--text2);font-weight:500;margin-bottom:11px;line-height:1.4;
}
.card-arrow{color:var(--maple);font-size:12px;flex-shrink:0}
.card-hls{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.card-hl{font-size:13px;color:var(--text2);display:flex;align-items:flex-start;gap:7px;line-height:1.45}
.hl-dot{flex-shrink:0;width:4px;height:4px;border-radius:50%;background:var(--text3);margin-top:6px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.ctag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.ct-booked{background:#D5F5E3;color:#1E8449}
.ct-peak{background:#FADBD8;color:#922B21}
.ct-warn{background:#FDEBD0;color:#CA6F1E}
.ct-choice{background:#D6EAF8;color:#1F618D}
.ct-free{background:#E8F8F5;color:#1D6A46}
.ct-special{background:#FEF9E7;color:#9A7D0A}
.ct-holiday{background:#EBF5FB;color:#1A5276}

/* ── DETAIL HEADER ── */
.det-hd{color:#fff;position:sticky;top:0;z-index:10}
.det-back-bar{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px 12px;
}
.back-btn{
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.18);border:none;
  color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.back-btn:active{background:rgba(255,255,255,.32)}
.det-back-info{flex:1}
.det-back-num{font-family:'DM Mono',monospace;font-size:11px;opacity:.7}
.det-back-city{font-size:14px;font-weight:600}
.det-hero-body{padding:0 20px 22px;position:relative}
.det-hero-body::after{
  content:attr(data-emoji);position:absolute;right:10px;bottom:0;
  font-size:100px;opacity:.1;line-height:1;pointer-events:none;
}
.det-daynum{font-size:11px;font-family:'DM Mono',monospace;opacity:.65;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.det-ttl{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;line-height:1.2}
.det-city{font-size:14px;opacity:.8;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.det-date{font-family:'DM Mono',monospace;font-size:11px;opacity:.6}
.swipe-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 20px;background:rgba(0,0,0,.15);
  color:rgba(255,255,255,.55);font-size:11px;font-family:'DM Mono',monospace;
}

/* ── DETAIL CONTENT ── */
.det-content{padding:14px 16px 80px;max-width:480px;margin:0 auto}
.sec-lbl{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);font-weight:700;margin:18px 0 10px;
}

/* ── ROUTE MAP SECTION ── */
.rmap-section{
  background:var(--card);border-radius:var(--r-sm);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--sh);
}
.rmap-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;cursor:pointer;font-size:14px;font-weight:600;
  color:var(--text2);border:none;background:transparent;
  font-family:'Noto Sans TC',sans-serif;width:100%;
  -webkit-tap-highlight-color:transparent;
}
.rmap-toggle:active{background:var(--surf)}
.rmt-arr{transition:transform .2s;flex-shrink:0;color:var(--text3);font-size:18px}
.rmt-arr.open{transform:rotate(180deg)}
.rmap-frame{display:none;height:260px}
.rmap-frame.open{display:block}
.rmap-legend{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:9px 16px 11px;background:var(--surf);
  border-top:1px solid var(--border);
}
.rml-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.rml-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}

/* ── HOTEL CARD ── */
.hotel-card{
  background:var(--card);border-radius:var(--r-sm);
  padding:16px;margin-bottom:12px;
  border-left:4px solid #6C3483;box-shadow:var(--sh);
}
.hotel-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:700;margin-bottom:6px}
.hotel-name{font-size:16px;font-weight:700;margin-bottom:4px}
.hotel-addr{font-size:13px;color:var(--text2);margin-bottom:2px}
.hotel-nights{font-size:13px;color:var(--text2);margin-bottom:8px}
.pay-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:10px}
.pay-paid{background:#D5F5E3;color:#1E8449}
.pay-unpaid{background:#FDEBD0;color:#CA6F1E}
.hotel-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:11px 16px;border-radius:10px;font-size:13px;
  font-family:'Noto Sans TC',sans-serif;font-weight:600;
  cursor:pointer;border:none;text-decoration:none;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.btn-maple{background:var(--maple);color:#fff}
.btn-maple:active{opacity:.8}
.btn-out{background:transparent;color:var(--text2);border:1.5px solid rgba(0,0,0,.14)}
.btn-out:active{background:var(--surf)}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:28px}
.timeline::before{
  content:'';position:absolute;left:11px;top:24px;bottom:24px;
  width:2px;background:var(--border);border-radius:2px;
}
.ev-card{position:relative;margin-bottom:14px}
.ev-dot{
  position:absolute;left:-26px;top:18px;width:20px;height:20px;
  border-radius:50%;background:var(--card);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:9px;z-index:1;
}
.ev-inner{
  background:var(--card);border-radius:var(--r-sm);
  padding:14px 16px;box-shadow:var(--sh);
  border:1px solid var(--border);
}
.ev-inner.is-transit{border-left:3px solid #6C3483}
.ev-inner.is-flight{border-left:3px solid var(--maple)}
.ev-inner.is-tips{background:linear-gradient(135deg,#FEF9E7,#FDEBD0);border-color:#F9E79F}
.ev-inner.is-warning{background:linear-gradient(135deg,#FDEDEC,#FDEBD0);border-left:3px solid #E74C3C}
.ev-inner.is-choice{background:linear-gradient(135deg,#EBF5FB,#E8F8F5);border-left:3px solid #2E86C1}
.ev-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ev-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);white-space:nowrap;flex-shrink:0;padding-top:2px}
.ev-ttl{font-size:16px;font-weight:700;flex:1;min-width:100px;line-height:1.3}
.ev-badges{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.s-badge{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.s-booked{background:#D5F5E3;color:#1E8449}
.s-est{background:#FDEBD0;color:#CA6F1E}
.s-free{background:#EBF5FB;color:#1A5276}
.ev-desc{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:10px}

/* ── TRANSIT CARD ── */
.tr-card{background:var(--surf);border-radius:10px;padding:12px 14px;margin-top:10px}
.tr-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tr-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.tb-flight{background:#FADBD8;color:#922B21}
.tb-train{background:#E8DAEF;color:#6C3483}
.tb-subway{background:#D6EAF8;color:#1F618D}
.tb-bus,.tb-brt{background:#D5F5E3;color:#1E8449}
.tb-shuttle,.tb-tour{background:#FDEBD0;color:#CA6F1E}
.tb-uber{background:#F2F3F4;color:#2C3E50}
.tb-ferry{background:#D6EAF8;color:#1A5276}
.tb-bike{background:#D5F5E3;color:#1D6A46}
.tr-line{font-size:13px;font-weight:600}
.tr-steps{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.tr-step{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);line-height:1.55}
.tr-step-ic{flex-shrink:0;width:20px;text-align:center}
.tr-note{font-size:12px;color:var(--text2);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);line-height:1.55}
.tr-cost{font-size:12px;font-family:'DM Mono',monospace;color:var(--forest);font-weight:700;margin-top:6px}

/* ── VIA ALTERNATES ── */
.via-alts{background:var(--surf);border-radius:10px;padding:12px 14px;margin-top:10px}
.via-alts-ttl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:700;margin-bottom:8px}
.via-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.via-row:last-child{border-bottom:none;padding-bottom:0}
.via-tag{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;flex-shrink:0}
.via-rec{background:#D5F5E3;color:#1E8449}
.via-alt{background:#EBF5FB;color:#1A5276}
.via-time{font-family:'DM Mono',monospace;color:var(--text);font-weight:600;flex:1}
.via-dur{color:var(--text3);font-size:12px}

/* ── LOC MAP ── */
.loc-wrap{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.loc-trigger{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;cursor:pointer;width:100%;background:var(--card);
  border:none;font-family:'Noto Sans TC',sans-serif;font-size:13px;
  font-weight:500;color:var(--text2);gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.loc-trigger:active{background:var(--surf)}
.loc-arr{transition:transform .2s;flex-shrink:0;color:var(--text3);font-size:16px}
.loc-arr.open{transform:rotate(180deg)}
.loc-frame{display:none;height:200px}
.loc-frame.open{display:block}
.loc-frame iframe{width:100%;height:100%;border:none;display:block}
.loc-ext{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;background:var(--surf);border-top:1px solid var(--border);
  font-size:12px;color:var(--text2);text-decoration:none;
}
.loc-ext:active{background:var(--border)}

/* ── CHOICE CARDS ── */
.choice-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choice-card{background:#fff;border:1.5px solid #AED6F1;border-radius:10px;padding:14px}
.ch-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ch-badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.cb-kkday{background:#FF6B35;color:#fff}
.cb-klook{background:#E74C3C;color:#fff}
.ch-card-ttl{font-size:14px;font-weight:700}
.ch-card-detail{font-size:13px;color:var(--text2);line-height:1.6}
.ch-card-price{font-size:13px;font-weight:700;color:var(--forest);margin-top:6px;font-family:'DM Mono',monospace}

/* ── MAP OVERLAY ── */
.map-overlay{
  position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;
  transform:translateY(100%);background:var(--bg);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.map-overlay.open{transform:translateY(0)}
.map-ov-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;flex-shrink:0;
  background:linear-gradient(135deg,#0D1B2A,#1B2838 60%,#7B241C);color:#fff;
}
.map-ov-ttl{font-size:17px;font-weight:700}
.map-close-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;color:#fff;font-size:24px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.map-close-btn:active{background:rgba(255,255,255,.3)}
.map-ov-body{flex:1;min-height:0}
.map-city-nav{
  padding:12px 16px;background:var(--card);
  border-top:1px solid var(--border);flex-shrink:0;
  display:flex;flex-wrap:wrap;gap:7px;
}
.city-btn{
  padding:7px 13px;border-radius:20px;background:var(--surf);
  border:1px solid var(--border);font-size:12px;cursor:pointer;
  color:var(--text);font-family:'Noto Sans TC',sans-serif;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
}
.city-btn:active{background:#FADBD8;border-color:var(--maple);color:var(--maple)}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:400;display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--card);width:100%;max-width:480px;height:80vh;
  border-radius:20px 20px 0 0;overflow:hidden;
  display:flex;flex-direction:column;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-ttl{font-size:15px;font-weight:700}
.modal-close{
  background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2);
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.modal-iframe{flex:1;border:none;width:100%}
.modal-ft{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}

/* ── FAB ── */
.fab{
  position:fixed;bottom:22px;right:20px;width:50px;height:50px;
  background:var(--maple);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 16px rgba(192,57,43,.4);
  color:#fff;font-size:22px;border:none;z-index:50;
  opacity:0;transition:opacity .2s,transform .2s;transform:scale(.8);
  -webkit-tap-highlight-color:transparent;
}
.fab.vis{opacity:1;transform:scale(1)}

/* ── LEAFLET ── */
.lf-pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.7)}
.lf-sm{width:22px;height:22px;font-size:11px}
.leaflet-popup-content-wrapper{border-radius:12px!important}
.leaflet-popup-content{font-family:'Noto Sans TC',sans-serif!important;font-size:13px!important;margin:10px 14px!important}

@media(min-width:480px){
  .card-list,.det-content{max-width:480px}
  .choice-grid{flex-direction:row}
  .choice-card{flex:1}
  .loc-frame{height:260px}
  .rmap-frame{height:320px}
}

/* ── TRANSIT GUIDE ── */
.tg-card{
  background:#fff;border-radius:var(--r-sm);
  border-left:4px solid #1D6A46;box-shadow:var(--sh);
  margin-bottom:12px;overflow:hidden;
}
.tg-hd{
  background:linear-gradient(135deg,#1B4332,#2D6A4F);
  color:#fff;padding:12px 16px;
  font-size:13px;font-weight:700;letter-spacing:.03em;
  display:flex;align-items:center;gap:7px;
}
.tg-from{
  padding:10px 16px 6px;
  font-size:12px;color:var(--text3);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;
}
.tg-section{padding:10px 16px 4px}
.tg-sec-ttl{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:#1D6A46;font-weight:700;margin-bottom:8px;
  display:flex;align-items:center;gap:5px;
}
.tg-steps{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.tg-step{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 10px;background:#F4FAF6;border-radius:8px;
}
.tg-step-ic{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.tg-step-body{flex:1;min-width:0}
.tg-step-main{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.tg-step-sub{font-size:12px;color:var(--text2);line-height:1.5;margin-top:2px;white-space:pre-line}
.tg-step.alt{background:#F0EDE8}
.tg-step.highlight{background:#D5F5E3}
.tg-divider{
  display:flex;align-items:center;gap:8px;
  padding:4px 16px;color:var(--text3);font-size:11px;
}
.tg-divider::before,.tg-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.tg-note{
  margin:6px 16px 10px;
  background:linear-gradient(135deg,#FEF9E7,#FDEBD0);
  border-radius:8px;padding:9px 12px;
  font-size:12px;color:#7D6608;line-height:1.55;
  border-left:3px solid #F9E79F;
}
.tg-tips{
  padding:8px 16px 12px;
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:4px;
}
.tg-tip{font-size:12px;color:var(--text2);display:flex;gap:5px;line-height:1.5}
.tg-rec-badge{
  display:inline-flex;padding:1px 7px;border-radius:10px;
  background:#FF6B6B20;color:#C0392B;
  font-size:10px;font-weight:700;flex-shrink:0;margin-left:5px;
}
</style>

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let homeScrollY = 0;
let curDayIdx = 0;
let mapCnt = 0;
let overviewMap = null;
let activeRMap = null;
let swipeStartX = 0, swipeStartY = 0;
let currentView = 'home'; // 'home' | 'detail'

// ══════════════════════════════════════════════
// NAV
// ══════════════════════════════════════════════
function goHome(fromPopState = false) {
  if (!fromPopState && history.state && history.state.view !== 'home') {
    history.back();
    return;
  }
  const hv = document.getElementById('homeView');
  const dv = document.getElementById('detailView');
  hv.classList.remove('off-left');
  dv.classList.add('off-right');
  // destroy active route map
  if (activeRMap) { activeRMap.remove(); activeRMap = null; }
  currentView = 'home';
  updateFab();
  setTimeout(() => { hv.scrollTop = homeScrollY; }, 20);
}

function goDetail(idx, fromPopState = false, replaceHistory = false) {
  homeScrollY = document.getElementById('homeView').scrollTop;
  curDayIdx = idx;
  renderDetail(idx);
  document.getElementById('homeView').classList.add('off-left');
  const dv = document.getElementById('detailView');
  dv.classList.remove('off-right');
  dv.scrollTop = 0;
  currentView = 'detail';
  updateFab();
  
  if (!fromPopState) {
    if (replaceHistory) {
      history.replaceState({view: 'detail', idx: idx}, '');
    } else {
      history.pushState({view: 'detail', idx: idx}, '');
    }
  }
}

function showMap(fromPopState = false) {
  document.getElementById('mapOverlay').classList.add('open');
  if (!overviewMap) setTimeout(() => initOverviewMap(), 100);
  else setTimeout(() => overviewMap.invalidateSize(), 100);
  if (!fromPopState) {
    history.pushState({view: 'map'}, '');
  }
}
function closeMap(fromPopState = false) {
  if (!fromPopState) {
    history.back();
    return;
  }
  document.getElementById('mapOverlay').classList.remove('open');
}

function updateFab() {
  const fab = document.getElementById('fab');
  fab.onclick = () => {
    const v = currentView === 'home' ? document.getElementById('homeView') : document.getElementById('detailView');
    v.scrollTo({top:0,behavior:'smooth'});
  };
}

// ══════════════════════════════════════════════
// SWIPE (detail view)
// ══════════════════════════════════════════════
(function setupSwipe() {
  const dv = document.getElementById('detailView');
  dv.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, {passive:true});
  dv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 65) {
      if (dx > 0) { // swipe right = prev
        if (curDayIdx > 0) goDetail(curDayIdx - 1, false, true);
        else goHome();
      } else { // swipe left = next
        if (curDayIdx < days.length - 1) goDetail(curDayIdx + 1, false, true);
      }
    }
  }, {passive:true});
})();

// ══════════════════════════════════════════════
// FAB VISIBILITY
// ══════════════════════════════════════════════
['homeView','detailView'].forEach(id => {
  document.getElementById(id).addEventListener('scroll', function() {
    document.getElementById('fab').classList.toggle('vis', this.scrollTop > 250);
  }, {passive:true});
});

// ══════════════════════════════════════════════
// RENDER HOME
// ══════════════════════════════════════════════
function renderHome() {
  const regions = [
    {label:'✈️ 出發 & 多倫多',days:[0,1,2,3,4]},
    {label:'🚂 東岸火車之旅',days:[5,6,7,8,9,10,11]},
    {label:'✈️ 飛越大陸 → 洛磯山脈',days:[12,13,14,15,16,17]},
    {label:'🌊 溫哥華 & 返程',days:[18,19,20,21,22,23]},
  ];
  let html = `
    <div class="home-hd">
      <div class="home-hd-bar">
        <div class="home-hd-left">
          <div class="home-hd-ttl">🍁 精靈 &amp; 小狐狸的加拿大蜜月</div>
          <div class="home-hd-sub">2026.09.23 – 10.17 · 加拿大東西岸 · v1.2.0</div>
        </div>
        <button class="map-btn" onclick="showMap()">🗺️ 全程地圖</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num">24</div><div class="stat-lbl">天</div></div>
      <div class="stat-item"><div class="stat-num">9</div><div class="stat-lbl">城市</div></div>
      <div class="stat-item"><div class="stat-num">5</div><div class="stat-lbl">省份</div></div>
      <div class="stat-item"><div class="stat-num">4</div><div class="stat-lbl">楓葉 Peak</div></div>
    </div>
    <div class="card-list">`;
  regions.forEach(r => {
    html += `<div class="region-lbl">${r.label}</div>`;
    r.days.forEach(i => { html += renderCard(days[i], i); });
  });
  html += `</div>`;
  document.getElementById('homeView').innerHTML = html;
}

function renderCard(d, idx) {
  const c = d.card;
  const isSamePlace = c.from === c.to;
  const routeHtml = isSamePlace
    ? `<span class="card-route-from">📍 ${c.from}</span>`
    : `<span class="card-route-from">📍 ${c.from}</span><span class="card-arrow">→</span><span class="card-route-to">${c.to}</span>`;
  const hlHtml = c.hl.map(h => `<div class="card-hl"><span class="hl-dot"></span><span>${h}</span></div>`).join('');
  const tagsHtml = c.tags.map(t => `<span class="ctag ct-${t.c}">${t.t}</span>`).join('');
  return `<div class="day-card" onclick="goDetail(${idx})" id="card_${idx}">
    <div class="card-hero" style="background:${d.city.bg}" data-emoji="${d.city.emoji}">
      <div class="card-top">
        <div class="card-daynum">${d.day}</div>
        <div class="card-info">
          <div class="card-dateline">${d.date} · ${d.full.match(/（(.+)）/)?.[1]||''}</div>
          <div class="card-ttl">${d.title}</div>
        </div>
        <span style="font-size:28px;flex-shrink:0;opacity:.8">${d.city.emoji}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-route">${routeHtml}</div>
      <div class="card-hls">${hlHtml}</div>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// RENDER DETAIL
// ══════════════════════════════════════════════
function renderDetail(idx) {
  const d = days[idx];
  const hasPrev = idx > 0;
  const hasNext = idx < days.length - 1;
  const swipeHint = `${hasPrev ? '← 前一天' : '←返回首頁'} &nbsp;&nbsp; ${hasNext ? '下一天 →' : '（最後一天）'}`;
  const html = `

// RENDER HELPERS

function renderDayTransit(tr) {
  if (!tr) return '';
  function stepsHtml(steps, extraCls='') {
    if (!steps||!steps.length) return '';
    return steps.map(s=>`<div class="tg-step ${extraCls}">
      <span class="tg-step-ic">${s.icon}</span>
      <div class="tg-step-body">
        <div class="tg-step-main">${s.text}${s.rec?`<span class="tg-rec-badge">推薦</span>`:''}</div>
        ${s.sub?`<div class="tg-step-sub">${s.sub}</div>`:''}
      </div>
    </div>`).join('');
  }
  const sections = tr.sections||[];
  const sectionsHtml = sections.map(s=>`
    <div class="tg-section">
      <div class="tg-sec-ttl">${s.title}</div>
      <div class="tg-steps">${stepsHtml(s.steps)}</div>
      ${s.alt&&s.alt.length?`<div class="tg-divider">或</div><div class="tg-steps">${stepsHtml(s.alt,'alt')}</div>`:''}
    </div>`).join('');
  const noteHtml = tr.note?`<div class="tg-note">⭐ ${tr.note}</div>`:'';
  const tipsHtml = tr.tips&&tr.tips.length?`<div class="tg-tips">${tr.tips.map(t=>`<div class="tg-tip">💡 <span>${t}</span></div>`).join('')}</div>`:'';
  return `<div class="tg-card">
    <div class="tg-hd">🚌 今日交通指南</div>
    ${tr.from?`<div class="tg-from">🏨 出發地：${tr.from}</div>`:''}
    ${sectionsHtml}
    ${noteHtml}
    ${tipsHtml}
  </div>`;
}

function dotClr(type) {
  const m={flight:'#C0392B',train:'#6C3483',subway:'#1F618D',bus:'#1E8449',brt:'#1E8449',shuttle:'#CA6F1E',tour:'#9A7D0A',activity:'#1B4332',hotel:'#6C3483',uber:'#2C3E50',ferry:'#1A5276',bike:'#1D6A46',tips:'#9A7D0A',warning:'#E74C3C',choice:'#2E86C1'};
  return m[type]||'#A09890';
}

function renderEvent(ev) {
  const cfg = T[ev.type]||T.activity;
  const stCfg = ev.status ? STATUS[ev.status] : null;
  const lCls = {tips:'is-tips',warning:'is-warning',choice:'is-choice',flight:'is-flight',train:'is-transit',subway:'is-transit',bus:'is-transit',brt:'is-transit',shuttle:'is-transit',uber:'is-transit',ferry:'is-transit'}[ev.type]||'';
  return `<div class="ev-card">
    <div class="ev-dot" style="border-color:${dotClr(ev.type)}30;background:${dotClr(ev.type)}18">
      <span>${cfg.icon}</span>
    </div>
    <div class="ev-inner ${lCls}">
      <div class="ev-top">
        <span class="ev-time">${ev.time}</span>
        <span class="ev-ttl">${ev.title}</span>
        <div class="ev-badges">${stCfg?`<span class="s-badge ${stCfg.cls}">${stCfg.label}</span>`:''}</div>
      </div>
      ${ev.desc?`<div class="ev-desc">${ev.desc.replace(/\n/g,'<br>')}</div>`:''}
      ${renderTransit(ev.transit)}
      ${renderAlts(ev.alternates)}
      ${renderChoices(ev.choices)}
      ${renderLocMap(ev.loc)}
    </div>
  </div>`;
}

function renderTransit(tr) {
  if (!tr) return '';
  const cfg = T[tr.mode]||T.bus;
  const steps = (tr.steps||[]).map(s=>`<div class="tr-step"><span class="tr-step-ic">${s.icon}</span><span>${s.text}</span></div>`).join('');
  return `<div class="tr-card">
    <div class="tr-hd"><span class="tr-badge ${cfg.cls}">${cfg.icon} ${cfg.label}</span><span class="tr-line">${tr.line||''}</span></div>
    ${steps?`<div class="tr-steps">${steps}</div>`:''}
    ${tr.duration?`<div class="tr-note">⏱ ${tr.duration}</div>`:''}
    ${tr.note?`<div class="tr-note">💬 ${tr.note}</div>`:''}
    ${tr.cost?`<div class="tr-cost">💰 ${tr.cost}</div>`:''}
  </div>`;
}

function renderAlts(alts) {
  if (!alts||!alts.length) return '';
  const rows = alts.map(a=>`<div class="via-row"><span class="via-tag ${a.tag==='推薦'?'via-rec':'via-alt'}">${a.tag}</span><span class="via-time">${a.time}</span><span class="via-dur">${a.dur}</span></div>`).join('');
  return `<div class="via-alts"><div class="via-alts-ttl">班次選擇</div>${rows}</div>`;
}

function renderChoices(choices) {
  if (!choices||!choices.length) return '';
  const cards = choices.map(c=>`<div class="choice-card">
    <div class="ch-card-hd"><span class="ch-badge ${c.badge}">${c.platform}</span><span class="ch-card-ttl">${c.title}</span></div>
    <div class="ch-card-detail">${c.detail.replace(/\n/g,'<br>')}</div>
    <div class="ch-card-price">💰 ${c.price}</div>
    ${c.link?`<a href="${c.link}" target="_blank" rel="noopener" class="btn btn-out" style="margin-top:8px;font-size:12px">🔗 查看詳情</a>`:''}
  </div>`).join('');
  return `<div class="choice-grid">${cards}</div>`;
}

function renderLocMap(loc) {
  if (!loc) return '';
  const id = 'mp'+(++mapCnt);
  const q = encodeURIComponent(loc.q||loc.name);
  const embed = `https://maps.google.com/maps?q=${q}&output=embed&hl=zh-TW&z=15`;
  const gLink = loc.ml||`https://www.google.com/maps/search/?api=1&query=${q}`;
  return `<div class="loc-wrap">
    <button class="loc-trigger" id="ltrig_${id}" onclick="toggleLocMap('${id}','${embed.replace(/'/g,"\\'")}','${(loc.name||'').replace(/'/g,"\\'")}','${gLink.replace(/'/g,"\\'")}')">
      <span>📍 ${loc.name}</span>
      <span class="loc-arr" id="larr_${id}">⌄</span>
    </button>
    <div class="loc-frame" id="${id}"></div>
    <a href="${gLink}" target="_blank" rel="noopener" class="loc-ext" id="lext_${id}" style="display:none">🗺️ 在 Google Maps 中開啟</a>
  </div>`;
}

function toggleLocMap(id, embed, name, gLink) {
  const frame = document.getElementById(id);
  const arr = document.getElementById('larr_'+id);
  const ext = document.getElementById('lext_'+id);
  if (frame.classList.contains('open')) {
    frame.classList.remove('open'); frame.innerHTML=''; arr.classList.remove('open'); ext.style.display='none';
  } else {
    frame.innerHTML=`<iframe src="${embed}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    frame.classList.add('open'); arr.classList.add('open'); ext.style.display='flex';
  }
}

function renderHotel(h) {
  if (!h) return '';
  const q = encodeURIComponent(h.q);
  const gLink = h.ml||`https://www.google.com/maps/search/?api=1&query=${q}`;
  const payBadge = h.paid===true?`<span class="pay-badge pay-paid">✅ 已付款</span>`:h.paid===false?`<span class="pay-badge pay-unpaid">🔶 待付款</span>`:'';

function renderRouteMapSection(dayNum) {
  const data = routeData[dayNum];
  if (!data) return '';
  const rid = 'rmap_'+dayNum;
  const seenLbs = new Set();
  const legend = (data.paths||[]).filter(p=>{if(seenLbs.has(p.lb))return false;seenLbs.add(p.lb);return true;})
    .map(p=>`<div class="rml-item"><div class="rml-line" style="background:${p.co};${p.da?'border-top:3px dashed '+p.co+';background:transparent;height:0':''}"></div>${p.lb}</div>`).join('');
  return `<div class="rmap-section">
    <button class="rmap-toggle" id="rtbtn_${dayNum}" onclick="toggleRMap(${dayNum},'${rid}')">
      <span>🗺️ 今日路線地圖</span>
      <span class="rmt-arr" id="rtarr_${dayNum}">⌄</span>
    </button>
    <div class="rmap-frame" id="${rid}"></div>
    ${legend?`<div class="rmap-legend">${legend}</div>`:''}
  </div>`;
}

function toggleRMap(dayNum, containerId) {
  const cont = document.getElementById(containerId);
  const arr = document.getElementById('rtarr_'+dayNum);
  if (cont.classList.contains('open')) {
    if (activeRMap) { activeRMap.remove(); activeRMap = null; }
    cont.classList.remove('open'); cont.innerHTML=''; arr.classList.remove('open');
  } else {
    if (activeRMap) { activeRMap.remove(); activeRMap = null; }
    cont.classList.add('open'); arr.classList.add('open');
    const data = routeData[dayNum];
    if (data) {
      const inner = document.createElement('div');
      inner.id='rmap_inner_'+dayNum; inner.style.cssText='height:100%;width:100%';
      cont.appendChild(inner);
      setTimeout(()=>{ activeRMap = buildLeafletMap('rmap_inner_'+dayNum, data); }, 50);
    }
  }
}

function openModal(q, name, ml, fromPopState = false) {
  const embed = `https://maps.google.com/maps?q=${q}&output=embed&hl=zh-TW&z=15`;
  const gLink = ml||`https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <div class="modal-hd">
          <span class="modal-ttl">📍 ${name}</span>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <iframe class="modal-iframe" src="${embed}" loading="lazy" allowfullscreen></iframe>
        <div class="modal-ft">
          <a href="${gLink}" target="_blank" class="btn btn-maple" style="width:100%;justify-content:center">🗺️ 在 Google Maps 中開啟</a>
        </div>
      </div>
    </div>`;
  if (!fromPopState) {
    history.pushState({view: 'modal', q: q, name: name, ml: ml}, '');
  }
}
function closeModal(fromPopState = false) {
  if (!fromPopState) {
    history.back();
    return;
  }
  document.getElementById('modalRoot').innerHTML='';
}

function mkIcon(ic, co, sm) {
  const sz=sm?22:30;
  return L.divIcon({html:`<div class="lf-pin${sm?' lf-sm':''}" style="background:${co}">${ic}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],className:''});
}

function buildLeafletMap(divId, data) {
  const map = L.map(divId, {center:data.center,zoom:data.zoom,zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',maxZoom:19}).addTo(map);
  (data.paths||[]).forEach(p=>L.polyline(p.coords,{color:p.co,weight:p.w||3,dashArray:p.da||null,opacity:.9}).addTo(map).bindTooltip(p.lb||'',{sticky:true}));
  (data.stops||[]).forEach(s=>L.marker([s.lat,s.lng],{icon:mkIcon(s.ic,s.co,false)}).addTo(map).bindPopup(`<b>${s.nm}</b>`));
  return map;
}

// ══════════════════════════════════════════════
// MAPLE LEAF FALL ANIMATION
// ══════════════════════════════════════════════
(function(){
  const canvas = document.createElement('canvas');
  canvas.id = 'mapleCanvas';
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9998;';
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let W, H, leaves = [], animId;

  const EMOJIS = ['🍁','🍁','🍁','🍂','🍁'];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function randomLeaf() {
    return {
      x: Math.random() * W,
      y: -20 - Math.random() * 80,
      size: 7 + Math.random() * 9,
      emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
      speedY: 1.5 + Math.random() * 1.5,
      speedX: (Math.random() - 0.5) * 0.6,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      swing: Math.random() * Math.PI * 2,
      swingSpeed: 0.012 + Math.random() * 0.012,
      swingAmp: 0.6 + Math.random() * 1.0,
      opacity: 0.25 + Math.random() * 0.25,
    };
  }

  function init() {
    resize();
    leaves = [];
    // 初始散佈全畫面
    for (let i = 0; i < 18; i++) {
      const l = randomLeaf();
      l.y = Math.random() * H;
      leaves.push(l);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    // 補葉
    if (leaves.length < 18 && Math.random() < 0.012) leaves.push(randomLeaf());

    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      l.swing += l.swingSpeed;
      l.x += l.speedX + Math.sin(l.swing) * l.swingAmp * 0.18;
      l.y += l.speedY;
      l.rot += l.rotSpeed;

      if (l.y > H + 30) { leaves.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = l.opacity;
      ctx.font = `${l.size * 2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.emoji, 0, 0);
      ctx.restore();
    }
    animId = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  tick();
})();

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
// Initialize state
if (!history.state) {
  history.replaceState({view: 'home'}, '');
}

window.addEventListener('popstate', function(event) {
  const state = event.state;
  
  // 1. If no state, go back to home view
  if (!state || state.view === 'home') {
    if (document.getElementById('modalRoot').innerHTML !== '') {
      closeModal(true);
    }
    if (document.getElementById('mapOverlay').classList.contains('open')) {
      closeMap(true);
    }
    if (currentView !== 'home') {
      goHome(true);
    }
    return;
  }
  
  // 2. If transitioning back to a detail view
  if (state.view === 'detail') {
    if (document.getElementById('modalRoot').innerHTML !== '') {
      closeModal(true);
    }
    if (document.getElementById('mapOverlay').classList.contains('open')) {
      closeMap(true);
    }
    goDetail(state.idx, true);
    return;
  }
  
  // 3. If transitioning to map view
  if (state.view === 'map') {
    if (document.getElementById('modalRoot').innerHTML !== '') {
      closeModal(true);
    }
    showMap(true);
    return;
  }
  
  // 4. If transitioning to modal view
  if (state.view === 'modal') {
    openModal(state.q, state.name, state.ml, true);
    return;
  }
});

renderHome();
updateFab();

setTimeout(() => {
  const s = document.getElementById('splash');
  s.classList.add('gone');
  setTimeout(() => { s.style.display='none'; }, 500);
}, 2000);
</script>

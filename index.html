<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍁 精靈 & 小狐狸的加拿大蜜月 2026</title>
<meta name="description" content="精靈 & 小狐狸的加拿大蜜月行程 2026.09.23–10.17，加拿大東西岸">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root {
  --bg:#F0EDE6;--surface:#FDFBF8;--surface2:#F5F2EC;--border:#E8E3DA;
  --text:#1C1917;--text2:#57534E;--text3:#A8A29E;
  --maple:#C0392B;--forest:#1B4332;--gold:#E9A825;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-md:0 4px 24px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC','Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.app-header{background:linear-gradient(135deg,#0D1B2A,#1B2838 60%,#7B241C);padding:16px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3)}
.app-title{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.app-subtitle{color:rgba(255,255,255,.6);font-size:10px;font-family:'DM Mono',monospace;margin-top:2px;margin-bottom:12px}

/* TABS */
.day-tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:0}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:10px 10px 0 0;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);transition:all .2s}
.day-tab:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9)}
.day-tab.active{background:var(--surface);color:var(--text)}
.day-tab .tab-emoji{font-size:14px}
.day-tab .tab-num{font-size:10px;font-weight:700;font-family:'DM Mono',monospace}
.day-tab .tab-date{font-size:8px;white-space:nowrap;opacity:.8}

/* PROGRESS */
.trip-progress{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px;color:var(--text3)}
.progress-bar{flex:1;height:3px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--maple),var(--gold));border-radius:3px;transition:width .4s ease}

/* CONTENT */
.content{max-width:720px;margin:0 auto;padding:14px 12px 80px}
.day-panel{display:none;animation:fadeSlide .25s ease}
.day-panel.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* DAY HERO */
.day-hero{border-radius:var(--radius);padding:22px 20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.day-hero::after{content:attr(data-emoji);position:absolute;right:-8px;bottom:-12px;font-size:90px;opacity:.12;line-height:1;pointer-events:none}
.day-hero-num{font-size:10px;font-family:'DM Mono',monospace;opacity:.7;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.day-hero-title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;line-height:1.2}
.day-hero-city{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.day-hero-date{font-family:'DM Mono',monospace;font-size:10px;opacity:.65;margin-top:8px}

/* HOTEL CARD */
.hotel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;border-left:3px solid #6C3483}
.hotel-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px;font-weight:600}
.hotel-name{font-size:14px;font-weight:600;margin-bottom:3px}
.hotel-meta{font-size:11px;color:var(--text2);display:flex;flex-direction:column;gap:2px}
.hotel-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:8px;font-size:11px;font-family:'Noto Sans TC',sans-serif;font-weight:500;cursor:pointer;border:none;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-maple{background:var(--maple);color:#fff}
.btn-maple:hover{opacity:.85}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--text2);color:var(--text)}

/* SECTION TITLE */
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:700;margin-bottom:10px;margin-top:18px}

/* TIMELINE */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:9px;top:22px;bottom:22px;width:2px;background:var(--border);border-radius:2px}

/* EVENT */
.event-card{position:relative;margin-bottom:12px}
.event-dot{position:absolute;left:-24px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;z-index:1}
.event-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;transition:box-shadow .15s}
.event-inner:hover{box-shadow:var(--shadow)}
.event-inner.is-transit{border-left:3px solid #6C3483}
.event-inner.is-flight{border-left:3px solid var(--maple)}
.event-inner.is-tips{background:linear-gradient(135deg,#FEF9E7,#FDEBD0);border-color:#F9E79F}
.event-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.event-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;padding-top:1px}
.event-title{font-size:14px;font-weight:600;flex:1;min-width:120px}
.event-badges{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.status-badge{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:20px;font-size:9px;font-weight:600}
.s-booked{background:#D5F5E3;color:#1E8449}
.s-est{background:#FDEBD0;color:#CA6F1E}
.s-free{background:#EBF5FB;color:#1A5276}
.event-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:8px}

/* TRANSIT CARD */
.transit-card{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:8px}
.transit-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.transit-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.tb-flight{background:#FADBD8;color:#922B21}
.tb-train{background:#E8DAEF;color:#6C3483}
.tb-subway{background:#D6EAF8;color:#1F618D}
.tb-bus,.tb-brt{background:#D5F5E3;color:#1E8449}
.tb-shuttle,.tb-tour{background:#FDEBD0;color:#CA6F1E}
.tb-uber{background:#F2F3F4;color:#2C3E50}
.tb-ferry{background:#D6EAF8;color:#1A5276}
.tb-bike{background:#D5F5E3;color:#1D6A46}
.tb-walk{background:#FEF9E7;color:#9A7D0A}
.transit-line-name{font-size:12px;font-weight:600}
.transit-steps{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.transit-step{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--text2);line-height:1.5}
.transit-step-icon{flex-shrink:0;width:18px;text-align:center}
.transit-note{font-size:11px;color:var(--text2);margin-top:4px;padding-top:4px;border-top:1px solid var(--border);line-height:1.5}
.transit-cost{font-size:10px;font-family:'DM Mono',monospace;color:var(--forest);font-weight:600;margin-top:5px}

/* LOCATION MAP */
.map-wrap{margin-top:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.map-trigger{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;width:100%;background:var(--surface);border:none;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;color:var(--text2);gap:8px}
.map-trigger:hover{background:var(--surface2)}
.map-trigger svg{transition:transform .2s;flex-shrink:0}
.map-trigger.open svg{transform:rotate(180deg)}
.map-iframe-wrap{display:none;height:200px}
.map-iframe-wrap.open{display:block}
.map-iframe-wrap iframe{width:100%;height:100%;border:none;display:block}
.map-ext-link{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;background:var(--surface2);border-top:1px solid var(--border);font-size:11px;color:var(--text2);text-decoration:none;transition:background .15s}
.map-ext-link:hover{background:var(--border)}

/* ROUTE MAP (Leaflet) */
.route-section{margin:14px 0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.route-toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;width:100%;background:var(--surface);border:none;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:600;color:var(--text2);gap:8px;transition:background .15s}
.route-toggle:hover{background:var(--surface2)}
.route-toggle.open{color:var(--forest);background:var(--surface2)}
.route-toggle .rt-arrow{transition:transform .2s}
.route-toggle.open .rt-arrow{transform:rotate(180deg)}
.route-map-container{display:none;height:260px}
.route-map-container.visible{display:block}
.route-legend{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;background:var(--surface2);border-top:1px solid var(--border)}
.route-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)}
.rl-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}

/* OVERVIEW PANEL */
.overview-hero{background:linear-gradient(135deg,#0D1B2A,#1B2838 60%,#7B241C);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;color:#fff}
.overview-hero-title{font-size:24px;font-weight:800;margin-bottom:6px}
.overview-hero-sub{font-size:12px;opacity:.75;font-family:'DM Mono',monospace}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.stat-num{font-size:26px;font-weight:800;font-family:'DM Mono',monospace;color:var(--maple);line-height:1}
.stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.overview-map-wrap{height:340px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
.city-nav{display:flex;flex-wrap:wrap;gap:7px}
.city-nav-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;transition:all .15s;color:var(--text)}
.city-nav-btn:hover{border-color:var(--maple);color:var(--maple)}
.legend-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}
.legend-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:700;margin-bottom:8px}
.legend-rows{display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text2)}
.leg-line{width:28px;height:4px;border-radius:2px;flex-shrink:0}

/* MAP MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.map-modal{background:var(--surface);width:100%;max-width:720px;height:80vh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.map-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.map-modal-head-title{font-size:14px;font-weight:600}
.map-modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.map-modal-close:hover{background:var(--surface2)}
.map-modal-iframe{flex:1;border:none;width:100%}
.map-modal-foot{padding:12px 18px;border-top:1px solid var(--border);flex-shrink:0}

/* FAB */
.fab{position:fixed;bottom:22px;right:16px;width:46px;height:46px;background:var(--maple);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);color:#fff;font-size:20px;border:none;z-index:50;opacity:0;transition:opacity .2s,transform .2s;transform:scale(.8)}
.fab.visible{opacity:1;transform:scale(1)}

/* SPLASH */
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#0D1B2A,#1B2838 50%,#7B241C);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:splashOut .5s ease 1.5s forwards}
.splash-emoji{font-size:72px;margin-bottom:20px;animation:bounce 1s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.splash-title{font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
.splash-sub{font-size:13px;opacity:.7;font-family:'DM Mono',monospace}
@keyframes splashOut{to{opacity:0;pointer-events:none}}

/* Leaflet custom */
.lf-pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.7)}
.lf-sm{width:22px;height:22px;font-size:11px}
.leaflet-popup-content-wrapper{border-radius:10px!important}
.leaflet-popup-content{font-family:'Noto Sans TC',sans-serif!important;font-size:12px!important;margin:8px 12px!important}

@media(min-width:640px){
  .content{padding:20px 20px 80px}
  .map-iframe-wrap{height:280px}
  .route-map-container{height:320px}
  .overview-map-wrap{height:420px}
  .day-tab{padding:8px 14px}
  .day-tab .tab-emoji{font-size:18px}
  .day-tab .tab-num{font-size:11px}
  .day-tab .tab-date{font-size:9px}
}
</style>
</head>

</div>

<div class="app-header">

// ─────────────────────────────────────────────
// MAP STATE
// ─────────────────────────────────────────────
let mapCounter = 0;
let overviewMap = null;
let activeRouteMap = null;
let activeRouteContainer = null;

// ─────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────
function renderTransit(tr) {
  if (!tr) return '';
  const cfg = T[tr.mode] || T.bus;
  const steps = (tr.steps||[]).map(s =>
    `<div class="transit-step"><span class="transit-step-icon">${s.icon}</span><span>${s.text}</span></div>`
  ).join('');
  return `<div class="transit-card">
    <div class="transit-header">
      <span class="transit-badge ${cfg.cls}">${cfg.icon} ${cfg.label}</span>
      <span class="transit-line-name">${tr.line||''}</span>
    </div>
    ${steps ? `<div class="transit-steps">${steps}</div>` : ''}
    ${tr.duration ? `<div class="transit-note">⏱ ${tr.duration}</div>` : ''}
    ${tr.note ? `<div class="transit-note">💬 ${tr.note}</div>` : ''}
    ${tr.cost ? `<div class="transit-cost">💰 ${tr.cost}</div>` : ''}
  </div>`;
}

function renderLocMap(loc) {
  if (!loc) return '';
  const id = 'mp'+(++mapCounter);
  const q = encodeURIComponent(loc.q||loc.name);
  const embed = `https://maps.google.com/maps?q=${q}&output=embed&hl=zh-TW&z=15`;
  const gLink = loc.ml || `https://www.google.com/maps/search/?api=1&query=${q}`;
  return `<div class="map-wrap">
    <button class="map-trigger" id="trig_${id}"
      onclick="toggleLocMap('${id}','${embed.replace(/'/g,"\\'")}','${(loc.name||'').replace(/'/g,"\\'")}','${gLink.replace(/'/g,"\\'")}')">
      <span>📍 ${loc.name}</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="map-iframe-wrap" id="${id}"></div>
    <a href="${gLink}" target="_blank" rel="noopener" class="map-ext-link" id="ext_${id}" style="display:none">
      🗺️ 在 Google Maps 中開啟
    </a>
  </div>`;
}

function toggleLocMap(id, embed, name, gLink) {
  const wrap = document.getElementById(id);
  const trig = document.getElementById('trig_'+id);
  const ext  = document.getElementById('ext_'+id);
  const isOpen = wrap.classList.contains('open');
  if (isOpen) {
    wrap.classList.remove('open'); wrap.innerHTML = '';
    ext.style.display='none'; trig.classList.remove('open');
  } else {
    wrap.innerHTML = `<iframe src="${embed}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    wrap.classList.add('open'); ext.style.display='flex'; trig.classList.add('open');
  }
}

function renderEvent(ev) {
  const cfg = T[ev.type] || T.activity;
  const stCfg = ev.status ? STATUS[ev.status] : null;
  const lCls = ev.type==='tips' ? 'is-tips' : (cfg.lCls||'');
  return `<div class="event-card">
    <div class="event-dot" style="border-color:${dotClr(ev.type)}20;background:${dotClr(ev.type)}22">
      <span style="font-size:9px">${cfg.icon}</span>
    </div>
    <div class="event-inner ${lCls}">
      <div class="event-top">
        <span class="event-time">${ev.time}</span>
        <span class="event-title">${ev.title}</span>
        <div class="event-badges">
          ${stCfg ? `<span class="status-badge ${stCfg.cls}">${stCfg.label}</span>` : ''}
        </div>
      </div>
      ${ev.desc ? `<div class="event-desc">${ev.desc.replace(/\n/g,'<br>')}</div>` : ''}
      ${renderTransit(ev.transit)}
      ${renderLocMap(ev.loc)}
    </div>
  </div>`;
}

function dotClr(type) {
  const m={flight:'#C0392B',train:'#6C3483',subway:'#1F618D',bus:'#1E8449',brt:'#1E8449',shuttle:'#CA6F1E',tour:'#9A7D0A',activity:'#1B4332',hotel:'#6C3483',uber:'#2C3E50',ferry:'#1A5276',bike:'#1D6A46',tips:'#9A7D0A'};
  return m[type]||'#A8A29E';
}

function renderHotel(h) {
  if (!h) return '';
  const q = encodeURIComponent(h.q);
  const gLink = h.ml || `https://www.google.com/maps/search/?api=1&query=${q}`;
  return `<div class="hotel-card">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <span style="font-size:28px;flex-shrink:0">🏨</span>
      <div style="flex:1;min-width:0">
        <div class="hotel-label">今晚住宿</div>
        <div class="hotel-name">${h.name}</div>
        <div class="hotel-meta">
          <span>📍 ${h.addr}</span>
          <span>🗓️ ${h.nights}</span>
        </div>
        <div class="hotel-actions">
          <button class="btn btn-maple" onclick="openModal('${q}','${h.name.replace(/'/g,"\\'")}','${(h.ml||'').replace(/'/g,"\\'")}')">📍 查看地圖</button>
          <a href="${gLink}" target="_blank" class="btn btn-outline">🗺️ Google Maps</a>

    </div>
  </div>`;
}

function renderRouteSection(dayNum) {
  const data = routeData[dayNum];
  if (!data) return '';
  const rid = 'rmap_'+dayNum;
  // Build legend
  const seenLabels = new Set();
  const legendItems = (data.paths||[]).filter(p => {
    if (seenLabels.has(p.lb)) return false;
    seenLabels.add(p.lb); return true;
  }).map(p => `
    <div class="route-legend-item">
      <div class="rl-line" style="background:${p.co};${p.da?'border-top:3px dashed '+p.co+';background:transparent;height:0':''}"></div>
      ${p.lb}
    </div>`).join('');
  return `<div class="route-section">
    <button class="route-toggle" id="rtbtn_${dayNum}"
      onclick="toggleRouteMap(${dayNum},'${rid}')">
      <span>🗺️ 今日路線地圖</span>
      <svg class="rt-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="route-map-container" id="${rid}"></div>
    ${legendItems ? `<div class="route-legend">${legendItems}</div>` : ''}
  </div>`;
}

// ─────────────────────────────────────────────
// LEAFLET MAP FUNCTIONS
// ─────────────────────────────────────────────
function mkIcon(ic, co, sm) {
  const sz = sm ? 22 : 30;
  return L.divIcon({
    html: `<div class="lf-pin${sm?' lf-sm':''}" style="background:${co}">${ic}</div>`,
    iconSize: [sz,sz], iconAnchor: [sz/2,sz/2], className:''
  });
}

function buildLeafletMap(divId, data) {
  const map = L.map(divId, {center: data.center, zoom: data.zoom, zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom:19
  }).addTo(map);
  (data.paths||[]).forEach(p => {
    L.polyline(p.coords, {color:p.co, weight:p.w||3, dashArray:p.da||null, opacity:.9})
     .addTo(map).bindTooltip(p.lb||'', {sticky:true});
  });
  (data.stops||[]).forEach((s,i) => {
    const isFirst = i===0, isLast = i===(data.stops.length-1);
    L.marker([s.lat,s.lng], {icon: mkIcon(s.ic, s.co, false)})
     .addTo(map).bindPopup(`<b>${s.nm}</b>`);
  });
  return map;
}

function toggleRouteMap(dayNum, containerId) {
  const cont = document.getElementById(containerId);
  const btn  = document.getElementById('rtbtn_'+dayNum);
  const isOpen = cont.classList.contains('visible');
  if (isOpen) {
    if (activeRouteMap) { activeRouteMap.remove(); activeRouteMap = null; }
    cont.classList.remove('visible'); cont.innerHTML = '';
    btn.classList.remove('open');
  } else {
    if (activeRouteMap) { activeRouteMap.remove(); activeRouteMap = null; }
    if (activeRouteContainer) {
      document.querySelectorAll('.route-map-container.visible').forEach(el => {
        el.classList.remove('visible'); el.innerHTML = '';
      });
      document.querySelectorAll('.route-toggle.open').forEach(el => el.classList.remove('open'));
    }
    cont.classList.add('visible');
    btn.classList.add('open');
    activeRouteContainer = cont;
    const data = routeData[dayNum];
    if (data) {
      const inner = document.createElement('div');
      inner.id = 'lf_inner_'+dayNum;
      inner.style.cssText = 'height:100%;width:100%';
      cont.appendChild(inner);
      setTimeout(() => {
        activeRouteMap = buildLeafletMap('lf_inner_'+dayNum, data);
      }, 50);
    }
  }
}

// ─────────────────────────────────────────────
// TABS & NAV
// ─────────────────────────────────────────────
function renderTabs() {
  const overviewTab = `<button class="day-tab active" id="tab_ov" onclick="switchDay('ov')">
    <span class="tab-emoji">🗺️</span>
    <span class="tab-num">總覽</span>
    <span class="tab-date">地圖</span>
  </button>`;
  const dayTabs = days.map((d,i) =>
    `<button class="day-tab" id="tab_${i}" onclick="switchDay(${i})">
      <span class="tab-emoji">${d.city.emoji}</span>
      <span class="tab-num">D${d.day}</span>
      <span class="tab-date">${d.date}</span>
    </button>`
  ).join('');
  document.getElementById('dayTabs').innerHTML = overviewTab + dayTabs;
}

function renderPanels() {
  document.getElementById('mainContent').innerHTML =
    renderOverviewPanel() +
    days.map(renderDayPanel).join('');
}

let cur = 'ov';
function switchDay(idx) {
  const prevId = cur==='ov' ? 'panel_ov' : 'panel_'+cur;
  const prevTab = cur==='ov' ? 'tab_ov' : 'tab_'+cur;
  document.getElementById(prevId).classList.remove('active');
  document.getElementById(prevTab).classList.remove('active');
  const nextId = idx==='ov' ? 'panel_ov' : 'panel_'+idx;
  const nextTab = idx==='ov' ? 'tab_ov' : 'tab_'+idx;
  document.getElementById(nextId).classList.add('active');
  document.getElementById(nextTab).classList.add('active');
  document.getElementById(nextTab).scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  cur = idx;
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  // close any open route map
  if (activeRouteMap && idx !== cur) {
    // keep it, it's in the now-hidden panel
  }
}

function updateProgress() {
  if (cur==='ov') {
    document.getElementById('progLabel').textContent = '總覽';
    document.getElementById('progCity').textContent = '🗺️ 加拿大';
    document.getElementById('progFill').style.width = '0%';
  } else {
    const d = days[cur];
    document.getElementById('progLabel').textContent = `Day ${d.day} / ${days.length}`;
    document.getElementById('progCity').textContent = `${d.city.emoji} ${d.city.name}`;
    document.getElementById('progFill').style.width = ((cur+1)/days.length*100)+'%';
  }
}

function openModal(q, name, ml) {
  const embed = `https://maps.google.com/maps?q=${q}&output=embed&hl=zh-TW&z=15`;
  const gLink = ml || `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="map-modal">
        <div class="map-modal-head">
          <span class="map-modal-head-title">📍 ${name}</span>
          <button class="map-modal-close" onclick="closeModal()">×</button>
        </div>
        <iframe class="map-modal-iframe" src="${embed}" loading="lazy" allowfullscreen></iframe>
        <div class="map-modal-foot">
          <a href="${gLink}" target="_blank" class="btn btn-maple" style="width:100%;justify-content:center;font-size:13px">
            🗺️ 在 Google Maps 中開啟
          </a>
        </div>
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
